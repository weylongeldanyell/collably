<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0f"><title>Collably</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="toast"></div>
<section id="auth" class="auth"><div class="authbox"><button class="x" id="authx">×</button><div class="logo"><b>C</b> collably</div><p class="sub">Find talent. Show your work. Build your team.</p><div class="tabs"><button data-auth="login" class="active">Log in</button><button data-auth="signup">Create account</button></div>
<form id="login" class="form"><label>Email<input id="le" type="email" required></label><label>Password<input id="lp" type="password" required></label><button class="primary">Log in</button><button type="button" class="ghost" id="demo">Try demo mode</button></form>
<form id="signup" class="form hide"><div class="roles"><button type="button" class="role active" data-role="worker"><b>✦ Worker</b><small>Get discovered and hired</small></button><button type="button" class="role" data-role="buyer"><b>⌁ Buyer</b><small>Find talent and post jobs</small></button></div><label>Full name<input id="sn" required></label><label>Username<input id="su" pattern="[A-Za-z0-9_]+" minlength="3" maxlength="24" required></label><label>Email<input id="se" type="email" required></label><label>Password<input id="sp" type="password" minlength="8" required></label><button class="primary">Create account</button></form><small class="sub">Demo mode saves to this browser. Real accounts need Supabase setup.</small></div></section>
<div id="app" class="hide"><header><button class="brand" data-page="home"><b>C</b> collably</button><div class="search">⌕<input id="search" placeholder="Search people, skills, tools..."></div><div class="headactions"><button data-page="notifications">♡<i id="dot"></i></button><button class="ava" data-page="profile" id="ava">C</button></div></header><div class="layout"><aside><nav><button data-page="home">⌂ <span>Home</span></button><button data-page="discover">◎ <span>Discover</span></button><button data-page="jobs">▣ <span>Jobs</span></button><button data-page="messages">✉ <span>Messages</span></button><button data-page="notifications">♡ <span>Notifications</span></button><button data-page="profile">◉ <span>Profile</span></button><button data-page="settings">⚙ <span>Settings</span></button></nav><div class="asidebottom"><small id="connection">Demo mode</small><button class="ghost" id="logout">Log out</button></div></aside><main id="main"></main></div><nav class="mobile"><button data-page="home">⌂<small>Home</small></button><button data-page="discover">◎<small>Discover</small></button><button data-page="jobs">▣<small>Jobs</small></button><button data-page="messages">✉<small>Messages</small></button><button data-page="profile">◉<small>Profile</small></button></nav></div><div id="modal"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
